<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Now Playing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Permanent+Marker&display=swap" rel="stylesheet">
<style>
  :root { --y:#ffe600; --k:#111; --w:#f4f1ea; }
  * { box-sizing:border-box; margin:0; }
  html,body { background:transparent; overflow:hidden; font-family:"Anton",Impact,"Arial Narrow",sans-serif; }
  #w { display:flex; align-items:center; width:500px; height:150px; padding:0 18px 0 10px;
       opacity:0; transition:opacity .5s ease; }
  #w.on { opacity:1; }
  #cw { position:relative; width:104px; height:104px; flex:none; z-index:2; margin-right:-14px;
        transform:rotate(-5deg); background:var(--w); padding:5px; border:3px solid var(--k); box-shadow:4px 4px 0 var(--k); }
  #cw::before { content:""; position:absolute; top:-12px; left:50%; width:46px; height:17px;
        transform:translateX(-50%) rotate(3deg); background:rgba(255,230,0,.88); }
  #cover { width:100%; height:100%; background:#222 center/cover; }
  #card { flex:1; min-width:0; transform:rotate(1deg); background:var(--w); color:var(--k);
          border:3px solid var(--k); box-shadow:6px 6px 0 var(--k); padding:10px 12px 9px 24px; }
  #title { font-size:28px; line-height:1.05; text-transform:uppercase; letter-spacing:.01em;
           white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #artist { display:inline-block; max-width:100%; margin-top:6px; padding:1px 8px; background:var(--y);
            font-family:"Permanent Marker","Comic Sans MS",cursive; font-size:14px; line-height:1.4;
            transform:rotate(-1deg); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; vertical-align:top; }
  #bar { margin-top:9px; height:10px; border:2px solid var(--k); background:var(--w); }
  #fill { height:100%; width:0; background:repeating-linear-gradient(-45deg,var(--k) 0 5px,var(--y) 5px 10px); }
  #meta { display:flex; align-items:center; gap:8px; margin-top:6px; font-size:14px; letter-spacing:.04em;
          font-variant-numeric:tabular-nums; }
  #tot { margin-left:auto; }
  #eq { display:flex; align-items:flex-end; gap:2px; height:14px; }
  #eq i { width:4px; height:100%; background:var(--k); transform-origin:bottom; animation:eq 1s ease-in-out infinite alternate; }
  #eq i:nth-child(1){animation-duration:.9s}
  #eq i:nth-child(2){animation-duration:.6s;animation-delay:-.3s}
  #eq i:nth-child(3){animation-duration:1.1s;animation-delay:-.5s}
  #eq i:nth-child(4){animation-duration:.7s;animation-delay:-.1s}
  #eq i:nth-child(5){animation-duration:1s;animation-delay:-.7s}
  @keyframes eq { from{transform:scaleY(.15)} to{transform:scaleY(1)} }
  .paused #eq i { animation-play-state:paused; }
  .swap #title,.swap #artist,.swap #cover { opacity:0; }
  #title,#artist,#cover { transition:opacity .3s ease; }
  #login { display:none; font:400 18px "Anton",Impact,sans-serif; text-transform:uppercase; padding:10px 18px; margin:20px;
           color:var(--k); background:var(--y); border:3px solid var(--k); box-shadow:4px 4px 0 var(--k); cursor:pointer; }
  @media (prefers-reduced-motion:reduce){ *{transition:none!important} #eq i{animation:none;transform:scaleY(.5)} }
</style>
</head>
<body>
<div id="w">
  <div id="cw"><div id="cover"></div></div>
  <div id="card">
    <div id="title"></div>
    <div id="artist"></div>
    <div id="bar"><div id="fill"></div></div>
    <div id="meta"><div id="eq"><i></i><i></i><i></i><i></i><i></i></div><span id="cur">0:00</span><span id="tot">0:00</span></div>
  </div>
</div>
<button id="login">Подключить Spotify</button>

<script>
// ====== НАСТРОЙКА ======
const CLIENT_ID = "238e0f46d407416d90357a2f213e1090";
const POLL_MS = 2000;
// Redirect URI в дашборде Spotify должен ТОЧНО совпадать с адресом этой страницы,
// например: http://127.0.0.1:8888/nowplaying.html
// ========================

const REDIRECT = location.origin + location.pathname;
const SCOPE = "user-read-currently-playing user-read-playback-state";
const $ = id => document.getElementById(id);
const store = {
  get: k => { try { return localStorage.getItem(k); } catch { return null; } },
  set: (k, v) => { try { localStorage.setItem(k, v); } catch {} },
  del: k => { try { localStorage.removeItem(k); } catch {} }
};

const b64 = buf => btoa(String.fromCharCode(...new Uint8Array(buf)))
  .replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");

async function login() {
  const verifier = b64(crypto.getRandomValues(new Uint8Array(48)));
  const challenge = b64(await crypto.subtle.digest("SHA-256", new TextEncoder().encode(verifier)));
  store.set("verifier", verifier);
  location.href = "https://accounts.spotify.com/authorize?" + new URLSearchParams({
    client_id: CLIENT_ID, response_type: "code", redirect_uri: REDIRECT,
    scope: SCOPE, code_challenge_method: "S256", code_challenge: challenge
  });
}

async function token(body) {
  const r = await fetch("https://accounts.spotify.com/api/token", {
    method: "POST",
    headers: { "Content-Type": "application/x-www-form-urlencoded" },
    body: new URLSearchParams({ client_id: CLIENT_ID, ...body })
  });
  if (!r.ok) return false;
  const d = await r.json();
  store.set("access", d.access_token);
  if (d.refresh_token) store.set("refresh", d.refresh_token);
  store.set("exp", Date.now() + (d.expires_in - 60) * 1000);
  return true;
}

const refresh = () => {
  const rt = store.get("refresh");
  return rt ? token({ grant_type: "refresh_token", refresh_token: rt }) : false;
};

const fmt = ms => { const s = Math.max(0, Math.floor(ms / 1000)); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); };
let cur = null, prog = 0, dur = 1, stamp = 0, playing = false;

function show(t) {
  const w = $("w");
  if (!t) { w.classList.remove("on"); cur = null; return; }
  if (t.id !== cur) {
    const first = cur === null;
    cur = t.id;
    const apply = () => {
      $("title").textContent = t.name;
      $("artist").textContent = t.artists.map(a => a.name).join(", ");
      const img = t.album.images[1] || t.album.images[0];
      $("cover").style.backgroundImage = img ? `url(${img.url})` : "none";
      w.classList.remove("swap");
    };
    if (first) apply(); else { w.classList.add("swap"); setTimeout(apply, 350); }
  }
  w.classList.add("on");
}

async function poll() {
  try {
    if (Date.now() > +store.get("exp")) await refresh();
    let r = await fetch("https://api.spotify.com/v1/me/player/currently-playing", {
      headers: { Authorization: "Bearer " + store.get("access") }
    });
    if (r.status === 401 && await refresh()) {
      r = await fetch("https://api.spotify.com/v1/me/player/currently-playing", {
        headers: { Authorization: "Bearer " + store.get("access") }
      });
    }
    if (r.status === 204 || !r.ok) { show(null); return; }
    const d = await r.json();
    if (!d.item || d.currently_playing_type !== "track") { show(null); return; }
    playing = d.is_playing; $("w").classList.toggle("paused", !playing); $("tot").textContent = fmt(d.item.duration_ms); prog = d.progress_ms; dur = d.item.duration_ms; stamp = performance.now();
    show(d.item);
  } catch { /* сеть моргнула, пробуем в следующий тик */ }
}

function tick() {
  const p = Math.min(dur, prog + (playing ? performance.now() - stamp : 0));
  $("cur").textContent = fmt(p);
  $("fill").style.width = Math.min(100, p / dur * 100) + "%";
  requestAnimationFrame(tick);
}

(async function init() {
  const code = new URLSearchParams(location.search).get("code");
  if (code) {
    await token({ grant_type: "authorization_code", code, redirect_uri: REDIRECT,
                  code_verifier: store.get("verifier") });
    history.replaceState({}, "", location.pathname);
  }
  if (!store.get("refresh")) {
    $("w").style.display = "none";
    $("login").style.display = "block";
    $("login").onclick = login;
    return;
  }
  poll(); setInterval(poll, POLL_MS); tick();
})();
</script>
</body>
</html>
