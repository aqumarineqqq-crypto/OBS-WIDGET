<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Now Playing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Pirata+One&family=Special+Elite&display=swap" rel="stylesheet">
<style>
  :root { --void:#0a0a0a; --ash:#d9d9d9; --bone:#efe9df; --blood:#c1121f; --grey:#8a8a8a; }
  * { box-sizing:border-box; margin:0; }
  html,body { background:transparent; overflow:hidden; font-family:"Special Elite","Courier New",monospace; }
  #w { display:flex; align-items:center; width:500px; height:150px; padding:0 10px; opacity:0; transition:opacity .6s ease; }
  #w.on { opacity:1; }
  #p { position:relative; display:flex; align-items:center; gap:16px; width:100%; height:118px; padding:11px 14px 11px 11px;
       background:transparent; border:1px solid rgba(217,217,217,.22); overflow:hidden; }
  #cw { position:relative; isolation:isolate; width:96px; height:96px; flex:none; }
  #cw::after { content:""; position:absolute; inset:0; background:var(--blood); mix-blend-mode:multiply; opacity:.6; }
  #cover { width:100%; height:100%; background:#222 center/cover; filter:grayscale(1) contrast(1.2) brightness(.9); }
  #card { position:relative; z-index:1; flex:1; min-width:0; }
  #title { font-family:"Pirata One","UnifrakturCook",Georgia,serif; font-size:36px; line-height:1.05; color:var(--bone);
           text-shadow:2px 0 rgba(193,18,31,.85),-1px 0 rgba(90,200,255,.3),0 2px 8px rgba(0,0,0,.75);
           white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #artist { margin-top:2px; text-shadow:0 1px 6px rgba(0,0,0,.85); font-size:14px; letter-spacing:.05em; color:var(--grey);
            white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #bar { margin-top:10px; height:3px; background:rgba(217,217,217,.2); }
  #fill { height:100%; width:0; background:var(--blood); box-shadow:0 0 8px var(--blood); }
  #meta { text-shadow:0 1px 6px rgba(0,0,0,.85); display:flex; align-items:center; gap:9px; margin-top:7px; font-size:13px; color:var(--grey); font-variant-numeric:tabular-nums; }
  #tot { margin-left:auto; }
  #eq { display:flex; align-items:flex-end; gap:2px; height:12px; }
  #eq i { width:2px; height:100%; background:var(--blood); transform-origin:bottom; animation:eq 1s ease-in-out infinite alternate; }
  #eq i:nth-child(1){animation-duration:.9s}
  #eq i:nth-child(2){animation-duration:.6s;animation-delay:-.3s}
  #eq i:nth-child(3){animation-duration:1.1s;animation-delay:-.5s}
  #eq i:nth-child(4){animation-duration:.7s;animation-delay:-.1s}
  #eq i:nth-child(5){animation-duration:1s;animation-delay:-.7s}
  @keyframes eq { from{transform:scaleY(.15)} to{transform:scaleY(1)} }
  .paused #eq i { animation-play-state:paused; }
  @keyframes glitch { 0%{transform:translate(0)} 20%{transform:translate(-4px,1px);opacity:.6} 40%{transform:translate(4px,-1px);opacity:1}
                      60%{transform:translate(-3px,0);opacity:.35} 80%{transform:translate(3px,1px);opacity:.8} 100%{transform:translate(0);opacity:.1} }
  .swap #title,.swap #cover { animation:glitch .35s linear forwards; }
  .swap #artist { opacity:0; }
  #title,#artist,#cover { transition:opacity .3s ease; }
  #login { display:none; margin:20px; padding:10px 18px; font:400 15px "Special Elite","Courier New",monospace; color:var(--bone);
           background:var(--void); border:1px solid var(--blood); cursor:pointer; }
  @media (prefers-reduced-motion:reduce){ *{transition:none!important;animation:none!important} #eq i{transform:scaleY(.5)} }
</style>
</head>
<body>
<div id="w">
  <div id="p">
    <div id="cw"><div id="cover"></div></div>
    <div id="card">
      <div id="title"></div>
      <div id="artist"></div>
      <div id="bar"><div id="fill"></div></div>
      <div id="meta"><div id="eq"><i></i><i></i><i></i><i></i><i></i></div><span id="cur">0:00</span><span id="tot">0:00</span></div>
    </div>
  </div>
</div>
<button id="login">Подключить Spotify</button>

<script>
// ====== НАСТРОЙКА ======
const CLIENT_ID = "238e0f46d407416d90357a2f213e1090";
const POLL_MS = 2000;
// Redirect URI в дашборде Spotify должен ТОЧНО совпадать с адресом этой страницы,
// например: http://127.0.0.1:8888/nowplaying.html
// ========================

const REDIRECT = location.origin + location.pathname;
const SCOPE = "user-read-currently-playing user-read-playback-state";
const $ = id => document.getElementById(id);
const store = {
  get: k => { try { return localStorage.getItem(k); } catch { return null; } },
  set: (k, v) => { try { localStorage.setItem(k, v); } catch {} },
  del: k => { try { localStorage.removeItem(k); } catch {} }
};

const b64 = buf => btoa(String.fromCharCode(...new Uint8Array(buf)))
  .replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");

async function login() {
  const verifier = b64(crypto.getRandomValues(new Uint8Array(48)));
  const challenge = b64(await crypto.subtle.digest("SHA-256", new TextEncoder().encode(verifier)));
  store.set("verifier", verifier);
  location.href = "https://accounts.spotify.com/authorize?" + new URLSearchParams({
    client_id: CLIENT_ID, response_type: "code", redirect_uri: REDIRECT,
    scope: SCOPE, code_challenge_method: "S256", code_challenge: challenge
  });
}

async function token(body) {
  const r = await fetch("https://accounts.spotify.com/api/token", {
    method: "POST",
    headers: { "Content-Type": "application/x-www-form-urlencoded" },
    body: new URLSearchParams({ client_id: CLIENT_ID, ...body })
  });
  if (!r.ok) return false;
  const d = await r.json();
  store.set("access", d.access_token);
  if (d.refresh_token) store.set("refresh", d.refresh_token);
  store.set("exp", Date.now() + (d.expires_in - 60) * 1000);
  return true;
}

const refresh = () => {
  const rt = store.get("refresh");
  return rt ? token({ grant_type: "refresh_token", refresh_token: rt }) : false;
};

const fmt = ms => { const s = Math.max(0, Math.floor(ms / 1000)); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); };
let cur = null, prog = 0, dur = 1, stamp = 0, playing = false;

function show(t) {
  const w = $("w");
  if (!t) { w.classList.remove("on"); cur = null; return; }
  if (t.id !== cur) {
    const first = cur === null;
    cur = t.id;
    const apply = () => {
      $("title").textContent = t.name;
      $("artist").textContent = t.artists.map(a => a.name).join(", ");
      const img = t.album.images[1] || t.album.images[0];
      $("cover").style.backgroundImage = img ? `url(${img.url})` : "none";
      w.classList.remove("swap");
    };
    if (first) apply(); else { w.classList.add("swap"); setTimeout(apply, 350); }
  }
  w.classList.add("on");
}

async function poll() {
  try {
    if (Date.now() > +store.get("exp")) await refresh();
    let r = await fetch("https://api.spotify.com/v1/me/player/currently-playing", {
      headers: { Authorization: "Bearer " + store.get("access") }
    });
    if (r.status === 401 && await refresh()) {
      r = await fetch("https://api.spotify.com/v1/me/player/currently-playing", {
        headers: { Authorization: "Bearer " + store.get("access") }
      });
    }
    if (r.status === 204 || !r.ok) { show(null); return; }
    const d = await r.json();
    if (!d.item || d.currently_playing_type !== "track") { show(null); return; }
    playing = d.is_playing; $("w").classList.toggle("paused", !playing); $("tot").textContent = fmt(d.item.duration_ms); prog = d.progress_ms; dur = d.item.duration_ms; stamp = performance.now();
    show(d.item);
  } catch { /* сеть моргнула, пробуем в следующий тик */ }
}

function tick() {
  const p = Math.min(dur, prog + (playing ? performance.now() - stamp : 0));
  $("cur").textContent = fmt(p);
  $("fill").style.width = Math.min(100, p / dur * 100) + "%";
  requestAnimationFrame(tick);
}

(async function init() {
  const code = new URLSearchParams(location.search).get("code");
  if (code) {
    await token({ grant_type: "authorization_code", code, redirect_uri: REDIRECT,
                  code_verifier: store.get("verifier") });
    history.replaceState({}, "", location.pathname);
  }
  if (!store.get("refresh")) {
    $("w").style.display = "none";
    $("login").style.display = "block";
    $("login").onclick = login;
    return;
  }
  poll(); setInterval(poll, POLL_MS); tick();
})();
</script>
</body>
</html>
